name: Format approval evidence (one-shot)

on:
  push:
    branches:
      - integration/found-002-r3
    paths:
      - .github/workflows/format-approval-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/found-002-r3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/github-readonly-gateway.test.ts
      - name: Commit formatter output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/github-readonly-gateway.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply exact Prettier output to gateway tests"
            git push
          fi
