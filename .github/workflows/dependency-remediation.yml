name: Dependency remediation (one-shot)

on:
  push:
    branches:
      - integration/found-002-r3
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Update vulnerable test tooling and safe transitive dependencies
        run: |
          npm install --save-dev 'vitest@^5.0.5'
          npm audit fix
      - name: Check dependency audit
        run: npm audit --audit-level=moderate
      - name: Verify on Node 24
        run: npm run verify
      - name: Commit verified dependency changes to integration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update vulnerable dependencies after verification"
            git push origin HEAD:integration/found-002-r3
          fi
