name: Format internal PR branches

on:
  push:
    branches:
      - "security/**"

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    concurrency:
      group: prettier-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Apply repository Prettier
        run: npm run format

      - name: Commit formatting only if PR head is unchanged
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Prettier made no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository Prettier"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}" --force-with-lease="refs/heads/${BRANCH_NAME}:${EXPECTED_SHA}"
